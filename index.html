<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASTRODYNE PRIME // WebGPU Spaceflight & AI Astrodynamics Simulator</title>
    <meta name="description" content="Next-Generation WebGPU Astrodynamics, Rocket Spaceflight & AI Orbital Physics Lab. Multi-stage rockets, relativistic N-body simulations, Hohmann transfers, and autonomous AI copilot." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23050811' stroke='%2300f2fe' stroke-width='4'/><circle cx='50' cy='50' r='18' fill='%2338bdf8'/><path d='M20,65 Q50,15 80,65' fill='none' stroke='%2338bdf8' stroke-width='4' stroke-dasharray='4,4'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <!-- WebGPU Canvas -->
      <canvas id="canvas-webgpu"></canvas>

      <!-- Flight Director HUD (Top Bar & Bottom Cockpit Flight Deck) -->
      <div id="flight-director-container"></div>

      <!-- ASTRA AI Assistant Drawer Container -->
      <div id="astra-container"></div>

      <!-- Sidebar Controls & Telemetry Panel -->
      <aside class="sidebar">
        <nav class="nav-tabs">
          <button class="nav-tab active" data-tab="presets">SCENARIOS</button>
          <button class="nav-tab" data-tab="controls">SETTINGS</button>
          <button class="nav-tab" data-tab="telemetry">TELEMETRY</button>
        </nav>

        <div class="tab-content-wrapper">
          <div id="tab-presets" class="tab-pane active">
            <div id="presets-content"></div>
          </div>
          <div id="tab-controls" class="tab-pane">
            <div id="controls-content"></div>
          </div>
          <div id="tab-telemetry" class="tab-pane">
            <div id="telemetry-content"></div>
          </div>
        </div>
      </aside>

      <!-- WebGPU Unsupported Fallback Overlay (Hidden by default) -->
      <div id="webgpu-fallback" class="overlay-banner" style="display: none;">
        <div class="overlay-card">
          <div class="overlay-title">WebGPU Hardware Acceleration Required</div>
          <div class="overlay-desc">
            Your browser or GPU environment does not currently support WebGPU compute passes.
            Please launch ASTRODYNE PRIME in a modern WebGPU-enabled browser (Google Chrome 113+, Microsoft Edge, Brave, or Firefox Nightly) with hardware acceleration enabled.
          </div>
          <button class="overlay-btn" onclick="location.reload()">Retry GPU Initialization</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
